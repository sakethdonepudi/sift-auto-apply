name: Validate extension package

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify Chrome Web Store ZIP
        run: ./scripts/package-extension.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sift-auto-apply-extension
          path: dist/*.zip
          if-no-files-found: error

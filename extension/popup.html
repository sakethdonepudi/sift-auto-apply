<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIFT</title>
  <link rel="stylesheet" href="extension.css">
</head>
<body class="popup">
  <main>
    <header class="brand-row">
      <div class="mark">S/</div>
      <div><p class="overline">EASY APPLY ASSISTANT</p><h1>SIFT</h1></div>
      <span id="phase" class="phase">READY</span>
    </header>
    <section class="run-card">
      <label>Target role<input id="quickRole" list="roleList" placeholder="Data Analyst" autocomplete="off"></label>
      <label>Location<input id="quickLocation" list="locationList" placeholder="Worldwide" autocomplete="off"></label>
      <div class="split">
        <label>Application limit<input id="quickLimit" type="number" min="1" max="100" value="25"></label>
        <div class="local-note"><b>Runs locally</b><span>Only after you press Start</span></div>
      </div>
    </section>
    <datalist id="roleList"></datalist>
    <datalist id="locationList"></datalist>
    <div class="progress"><i id="progressBar"></i></div>
    <div id="status" class="status" role="status">Loading…</div>
    <div class="counts">
      <div><b id="scanned">0</b><span>Scanned</span></div>
      <div class="accent"><b id="applied">0</b><span>Submitted</span></div>
      <div><b id="skipped">0</b><span>Skipped</span></div>
    </div>
    <div id="events" class="event-log"></div>
    <button id="start" class="primary">Start run <span>↗</span></button>
    <button id="stop" class="secondary">Stop safely</button>
    <div class="footer-actions">
      <button id="setup" class="text">Setup resume & answers</button>
      <button id="clear" class="text muted">Clear history</button>
    </div>
    <p class="fineprint">SIFT skips unsupported forms and pauses for LinkedIn security checks. Review saved answers before every run.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>

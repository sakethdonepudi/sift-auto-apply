<!doctype html><html><head><meta charset="utf-8"><title>SIFT setup</title><link rel="stylesheet" href="extension.css"></head>
<body><main><div class="mark">S/</div><p class="overline">SIFT COMPANION</p><h1>One-time setup.</h1><p class="intro">These answers are used only when LinkedIn asks the matching question. Unknown required questions cause the job to be skipped.</p>
<section><h2>Identity</h2><div class="grid"><label>Full name<input id="name"></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone"></label><label>LinkedIn URL<input id="linkedinUrl"></label></div></section>
<section><h2>Search brief</h2><div class="grid"><label>Exact role<input id="role" value="Data Analyst"></label><label>Exact location<input id="location" value="Hyderabad"></label><label>Maximum per run<input id="maxApplications" type="number" min="1" max="25" value="5"></label><label>Years of experience<input id="yearsExperience" type="number" min="0"></label></div></section>
<section><h2>Application defaults</h2><div class="grid"><label>Work authorized?<select id="workAuthorized"><option value="">Skip if asked</option><option>Yes</option><option>No</option></select></label><label>Need sponsorship?<select id="needsSponsorship"><option value="">Skip if asked</option><option>Yes</option><option>No</option></select></label><label>Expected salary<input id="salary"></label><label>Notice period<input id="noticePeriod"></label></div></section>
<section><h2>Resume</h2><label class="upload">PDF resume<input id="resume" type="file" accept=".pdf"></label><p id="resumeStatus">No resume saved.</p></section>
<div class="actions"><button id="save">Save setup</button><span id="message"></span></div></main><script src="options.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;width:440px;height:280px;overflow:hidden;background:#171a16;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}.wrap{position:relative;width:100%;height:100%;padding:36px}.mark{display:grid;width:46px;height:46px;place-items:center;border-radius:12px;background:#d9ff43;color:#171a16;box-shadow:3px 3px #fff;font-weight:900}.tag{margin-top:27px;color:#d9ff43;font-size:9px;font-weight:900;letter-spacing:.18em}h1{margin:8px 0 0;font-size:37px;line-height:.98;letter-spacing:-.055em}.ring{position:absolute;right:-38px;top:-55px;width:230px;height:230px;border:38px solid #d9ff43;border-radius:50%;opacity:.92}.slash{position:absolute;right:43px;bottom:25px;color:#d9ff43;font-size:60px;font-weight:900;transform:rotate(12deg)}</style></head><body><div class="wrap"><div class="ring"></div><div class="mark">S/</div><div class="tag">PRECISE · LOCAL · USER-STARTED</div><h1>Apply with<br>less noise.</h1><div class="slash">/</div></div></body></html>
